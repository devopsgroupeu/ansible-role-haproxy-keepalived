---
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # The failover scenario runs only on these two triggers.
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ansible-core ${{ matrix.ansible-core }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Every ansible-core line admitted by requirements.txt and meta/main.yml
      # min_ansible_version; 2.22 needs Python >= 3.13 on the control node.
      matrix:
        include:
          - ansible-core: "2.19"
            python: "3.12"
          - ansible-core: "2.20"
            python: "3.12"
          - ansible-core: "2.21"
            python: "3.12"
          - ansible-core: "2.22"
            python: "3.13"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt "ansible-core==${{ matrix.ansible-core }}.*"

      - name: Run yamllint
        run: python -m yamllint .

      - name: Run ansible-lint
        run: ansible-lint --profile production .

      # Every haproxy_version / keepalived_version literal in the docs and
      # examples must equal the role default.
      - name: Check documented versions match defaults
        shell: bash
        run: |
          set -eu
          rc=0
          for c in haproxy keepalived; do
            want=$(sed -n "s/^${c}_version: \"\([0-9.]*\)\"$/\1/p" defaults/main.yml)
            while IFS= read -r line; do
              got=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' <<<"${line#*:*:}" | head -n1)
              if [ "$got" != "$want" ]; then
                echo "::error::$(cut -d: -f1,2 <<<"$line"): ${c}_version ${got} differs from defaults/main.yml (${want})"
                rc=1
              fi
            done < <(grep -nE "${c}_version" README.md docs/*.md examples/*.yml | grep -E '[0-9]+\.[0-9]+\.[0-9]+' || true)
          done
          exit "$rc"

  molecule:
    name: molecule (${{ matrix.distro }} / ${{ matrix.scenario }})
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      fail-fast: false
      # Every prepare removes the images' policy-rc.d shim, so package installs
      # start services as on real hosts. EL9 runs the package scenario only
      # (SELinux cannot be exercised in a container). The failover scenario is
      # a separate job below.
      matrix:
        distro:
          - ubuntu2404
          - debian12
          - debian13
        scenario:
          - default
          - package
          - ssl
          - cloud-fip
        include:
          - distro: debian12
            scenario: source
          - distro: debian13
            scenario: source
          - distro: rockylinux9
            scenario: package
          # package-branch pins its own images (debian13 + ubuntu2404).
          - distro: debian13
            scenario: package-branch
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: pip install -r requirements.txt

      - name: Run molecule
        run: molecule test -s ${{ matrix.scenario }}
        env:
          MOLECULE_DISTRO: ${{ matrix.distro }}
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"

  # Real VRRP VIP migration between two containers. Election timing on shared
  # CI runners is less reliable, so this runs on demand and weekly instead of
  # gating pull requests.
  molecule-failover:
    name: molecule (${{ matrix.distro }} / failover)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        distro:
          - ubuntu2404
          - debian12
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: pip install -r requirements.txt

      - name: Run molecule
        run: molecule test -s failover
        env:
          MOLECULE_DISTRO: ${{ matrix.distro }}
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"

  ci-success:
    name: ci-success
    runs-on: ubuntu-latest
    needs: [lint, molecule]
    if: always()
    steps:
      - name: Fail if any required job did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "A required CI job (lint or molecule) did not succeed."
          exit 1
      - name: Confirm required jobs passed
        run: echo "lint + molecule succeeded"
