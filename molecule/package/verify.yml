---
- name: Verify package-mode install
  hosts: proxy_hosts
  become: true
  gather_facts: true
  tasks:
    - name: HAProxy binary present and executable
      ansible.builtin.command: haproxy -v
      register: hap_v
      changed_when: false
      failed_when: hap_v.rc != 0

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert haproxy and keepalived are active
      ansible.builtin.assert:
        that:
          - ansible_facts.services['haproxy.service'].state == 'running'
          - ansible_facts.services['keepalived.service'].state == 'running'
        fail_msg: "Package-mode services not running"
        success_msg: "Package-mode HAProxy + Keepalived running"

    # The geerlingguy test image ships with gcc pre-installed.
    # We check for source-specific build deps (liblua5.4-dev, libpcre2-dev)
    # that the role installs only in source mode - those prove no source path leaked.
    - name: Check for liblua5.4-dev (source-only HAProxy build dep, Debian/Ubuntu)
      ansible.builtin.command: dpkg -s liblua5.4-dev
      register: lua_dev_pkg
      changed_when: false
      failed_when: false
      when: ansible_facts['os_family'] == 'Debian'

    - name: Assert source-specific build deps absent in package mode (Debian/Ubuntu)
      ansible.builtin.assert:
        that:
          - lua_dev_pkg.rc != 0
        fail_msg: "liblua5.4-dev present in package mode (source build deps leaked)"
        success_msg: "Source-specific build deps absent in package mode"
      when: ansible_facts['os_family'] == 'Debian'

    - name: Validate HAProxy configuration syntax
      ansible.builtin.command: haproxy -c -f /etc/haproxy/haproxy.cfg
      changed_when: false
      register: hap_syntax
      failed_when: hap_syntax.rc != 0

    - name: Assert HAProxy configuration is valid
      ansible.builtin.assert:
        that:
          - hap_syntax.rc == 0
        fail_msg: "HAProxy configuration syntax invalid in package mode"
        success_msg: "HAProxy configuration valid in package mode"

    # /run/haproxy is lost on reboot; only the role's tmpfiles rule brings it
    # back on EL9 before HAProxy binds admin.sock.
    - name: Simulate a reboot of /run/haproxy and restart HAProxy
      ansible.builtin.shell: |
        set -o pipefail
        rm -rf /run/haproxy
        systemd-tmpfiles --create haproxy.conf
        systemctl restart haproxy
        stat -c %a:%U:%G /run/haproxy
      args:
        executable: /bin/bash
      register: hkv_tmpfiles_reboot
      changed_when: true

    - name: Read the HAProxy state after the restart
      ansible.builtin.systemd_service:
        name: haproxy
      register: hkv_hap_active

    - name: Assert HAProxy runs with a recreated admin socket directory
      ansible.builtin.assert:
        that:
          - hkv_hap_active.status.ActiveState == 'active'
          - hkv_tmpfiles_reboot.stdout == '750:root:haproxy'
        fail_msg: "haproxy {{ hkv_hap_active.status.ActiveState }}, /run/haproxy {{ hkv_tmpfiles_reboot.stdout }}"
        success_msg: "/run/haproxy recreated by tmpfiles; HAProxy active"

    # SELinux is disabled in the container (and absent on Debian/Ubuntu), so
    # the haproxy_connect_any tasks must have been skipped: they would have
    # installed python3-libsemanage, and seboolean fails without SELinux.
    - name: Gather package facts (RHEL family)
      ansible.builtin.package_facts:
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Assert the SELinux tasks were skipped with SELinux disabled
      ansible.builtin.assert:
        that:
          - (ansible_facts['selinux'] | default({})).get('status', 'disabled') != 'enabled'
          - "'python3-libsemanage' not in ansible_facts['packages']"
        fail_msg: "SELinux tasks ran although SELinux is not enabled"
        success_msg: "SELinux tasks skipped (SELinux not enabled)"
      when: ansible_facts['os_family'] == 'RedHat'
