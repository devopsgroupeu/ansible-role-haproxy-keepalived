---
- name: Prepare cloud-fip mock API
  hosts: all
  become: true
  gather_facts: true
  tasks:
    # The geerlingguy images ship /usr/sbin/policy-rc.d with "exit 101", which
    # stops package postinst scripts from starting services. Real hosts start
    # HAProxy on the stock config at install time; remove the shim so the role
    # is tested against that behaviour.
    - name: Allow package installs to start services (Debian/Ubuntu)
      ansible.builtin.file:
        path: /usr/sbin/policy-rc.d
        state: absent
      when: ansible_facts['os_family'] == 'Debian'

    - name: Fix PAM authentication for Rocky Linux
      ansible.builtin.lineinfile:
        path: /etc/pam.d/su
        regexp: '^account\s+required\s+pam_access.so'
        state: absent
      when: ansible_facts['os_family'] == 'RedHat'
      failed_when: false

    - name: Install python3 and iproute2 (Debian/Ubuntu)
      ansible.builtin.package:
        name:
          - python3
          - iproute2
        state: present
      when: ansible_facts['os_family'] == 'Debian'

    - name: Install python3 and iproute (Rocky/RHEL)
      ansible.builtin.package:
        name:
          - python3
          - iproute
        state: present
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Ensure systemd-journald is running
      ansible.builtin.service:
        name: systemd-journald
        state: started

    - name: Deploy mock Hetzner API responder
      ansible.builtin.copy:
        dest: /usr/local/bin/mock-hetzner-api.py
        mode: "0755"
        content: |
          #!/usr/bin/env python3
          # Answers every second assign with HTTP 423 "locked" (another action
          # still running), so each notify run must retry; requests without
          # the expected bearer token get 401.
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer

          POSTS = {"n": 0}

          class H(BaseHTTPRequestHandler):
              def _send(self, obj, code=200):
                  self.send_response(code)
                  self.send_header("Content-Type", "application/json")
                  self.end_headers()
                  self.wfile.write(json.dumps(obj).encode())

              def _authorized(self):
                  if self.headers.get("Authorization") == "Bearer test-token":
                      return True
                  self._send({"error": {"code": "unauthorized"}}, 401)
                  return False

              def do_GET(self):
                  if not self._authorized():
                      return
                  if "/servers" in self.path:
                      self._send({"servers": [{"id": 1, "name": "fip-node"}]})
                  elif "/floating_ips" in self.path:
                      self._send({"floating_ips": [{"id": 99, "ip": "203.0.113.10"}]})
                  else:
                      self._send({})

              def do_POST(self):
                  if not self._authorized():
                      return
                  POSTS["n"] += 1
                  if POSTS["n"] % 2 == 1:
                      self._send({"error": {"code": "locked", "message": "locked"}}, 423)
                  else:
                      self._send({"action": {"id": 1, "status": "running"}}, 201)

              def log_message(self, *a):
                  return

          HTTPServer(("127.0.0.1", 18088), H).serve_forever()

    - name: Deploy mock API systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/mock-hetzner-api.service
        mode: "0644"
        content: |
          [Unit]
          Description=Mock Hetzner API
          [Service]
          ExecStart=/usr/bin/python3 /usr/local/bin/mock-hetzner-api.py
          Restart=always
          [Install]
          WantedBy=multi-user.target

    - name: Start mock API
      ansible.builtin.systemd_service:
        name: mock-hetzner-api
        state: started
        enabled: true
        daemon_reload: true
