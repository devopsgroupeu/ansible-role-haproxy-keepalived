---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  # Master node - source-mode test (compiles HAProxy + Keepalived from source).
  # privileged: true required for systemd + keepalived VRRP VIP management
  # (CAP_NET_ADMIN needed to bind/unbind the VIP on the interface).
  - name: src-master
    image: geerlingguy/docker-${MOLECULE_DISTRO:-debian12}-ansible:latest
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    networks:
      # Isolated per-scenario network; VIP 172.18.0.230 on the default bridge /16.
      - name: molecule-source-net
    groups:
      - proxy_hosts

  # Backup node
  - name: src-backup
    image: geerlingguy/docker-${MOLECULE_DISTRO:-debian12}-ansible:latest
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    networks:
      - name: molecule-source-net
    groups:
      - proxy_hosts

provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: auto_silent
    ssh_connection:
      pipelining: false
  inventory:
    group_vars:
      all:
        haproxy_loadbalancer_master: "src-master"
        haproxy_loadbalancer_backup: "src-backup"
        haproxy_install_method: source
        keepalived_install_method: source
        # Pin the compiled versions + verified upstream checksums so the build is
        # reproducible and the source download is integrity-checked.
        haproxy_version: "3.4.8"
        haproxy_src_sha256: "sha256:024bd521a6cbbe32b426853147e6bbd6a89b107c5a34144846193fee5b7c6ed1"
        keepalived_version: "2.4.3"
        keepalived_src_sha256: "sha256:a0faef8e401c143487b131b526df7541c1e33d9b8814642fa9dfe8bb250a9632"
        haproxy_stats_page_pass: "test_password_123456"
        # The toolchain must be installed and removed only on compiling runs,
        # or idempotence fails.
        haproxy_remove_build_deps: true
        # Non-default group and a non-loopback stats bind: the tasks must
        # honour both (directory groups, readiness checks).
        haproxy_group: lbproxy
        haproxy_stats_bind_addr: "{{ ansible_facts['default_ipv4']['address'] }}"
        keepalived_network_interface: eth0
        # Non-default config dir: the template validates this file and the
        # systemd drop-in must point keepalived at it.
        keepalived_config_dir: /etc/keepalived-custom
        keepalived_vrrp_instances:
          - vrrp_instance_name: VI_SRC
            virtual_ipaddress: "172.18.0.230"
            virtual_router_id: 90
        haproxy_frontends:
          - name: fe
            address: "*"
            port: 8080
            default_backend: be
            mode: http
        haproxy_backends:
          - name: be
            mode: http
            servers:
              - name: app1
                address: 127.0.0.1
                port: 9

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
