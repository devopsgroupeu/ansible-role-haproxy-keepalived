---
- name: Prepare source-mode test environment
  hosts: all
  become: true
  gather_facts: true
  tasks:
    # The geerlingguy images ship /usr/sbin/policy-rc.d with "exit 101", which
    # stops package postinst scripts from starting services. Real hosts start
    # HAProxy on the stock config at install time; remove the shim so the role
    # is tested against that behaviour.
    - name: Allow package installs to start services (Debian/Ubuntu)
      ansible.builtin.file:
        path: /usr/sbin/policy-rc.d
        state: absent
      when: ansible_facts['os_family'] == 'Debian'

    - name: Fix PAM authentication for Rocky Linux
      ansible.builtin.lineinfile:
        path: /etc/pam.d/su
        regexp: '^account\s+required\s+pam_access.so'
        state: absent
      when: ansible_facts['os_family'] == 'RedHat'
      failed_when: false

    - name: Install iproute2 (Debian/Ubuntu)
      ansible.builtin.package:
        name: iproute2
        state: present
      when: ansible_facts['os_family'] == 'Debian'

    # The Rocky container image has no procps-ng (sysctl) and no
    # /etc/sysctl.d, both present on real EL9 hosts.
    - name: Install iproute and procps-ng (Rocky/RHEL)
      ansible.builtin.package:
        name:
          - iproute
          - procps-ng
        state: present
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Create /etc/sysctl.d (Rocky/RHEL container image)
      ansible.builtin.file:
        path: /etc/sysctl.d
        state: directory
        mode: "0755"
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Ensure systemd-journald is running
      ansible.builtin.service:
        name: systemd-journald
        state: started
