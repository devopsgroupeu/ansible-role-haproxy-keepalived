---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  # One node per supported branch repo: haproxy.debian.net (Debian) and the
  # vbernat PPA (Ubuntu). Each starts with the distro HAProxy installed, so the
  # role must move an existing install onto the branch.
  - name: hkv-branch-debian13
    image: geerlingguy/docker-debian13-ansible:latest
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    networks:
      - name: molecule-hkv-branch-net
    groups:
      - proxy_hosts

  - name: hkv-branch-ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    networks:
      - name: molecule-hkv-branch-net
    groups:
      - proxy_hosts

provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: auto_silent
    ssh_connection:
      pipelining: false
  inventory:
    host_vars:
      hkv-branch-debian13:
        haproxy_branch: "3.4"
        # trixie has no 3.0 branch repo: used by the negative validate check.
        hkv_unavailable_branch: "3.0"
      hkv-branch-ubuntu2404:
        haproxy_branch: "3.2"
        # noble has no 3.4 PPA: used by the negative validate check.
        hkv_unavailable_branch: "3.4"
    group_vars:
      all:
        haproxy_loadbalancer_master: "hkv-branch-debian13"
        haproxy_loadbalancer_backup: "hkv-branch-ubuntu2404"
        haproxy_install_method: package
        keepalived_enabled: false
        haproxy_stats_page_pass: "test_password_123456"
        haproxy_frontends:
          - name: fe
            address: "*"
            port: 8080
            default_backend: be
            mode: http
        haproxy_backends:
          - name: be
            mode: http
            servers:
              - name: app1
                address: 127.0.0.1
                port: 9

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
