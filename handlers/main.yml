---
# Reload systemd is defined before the restart handlers so that when a single
# task notifies both (e.g. a unit drop-in change), the daemon-reload runs first
# and the service restarts against the refreshed unit definition.
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart keepalived
  ansible.builtin.systemd_service:
    name: keepalived
    state: restarted
  when: keepalived_enabled | bool

- name: Restart haproxy
  ansible.builtin.systemd_service:
    name: haproxy
    state: restarted

# By basename, so the /etc/tmpfiles.d file is used as it is at boot.
- name: Apply HAProxy tmpfiles rules
  ansible.builtin.command: systemd-tmpfiles --create haproxy.conf
  changed_when: true

- name: Reload keepalived
  ansible.builtin.systemd_service:
    name: keepalived
    state: reloaded
  when: keepalived_enabled | bool

- name: Restart rsyslog
  ansible.builtin.systemd_service:
    name: rsyslog
    state: restarted
    enabled: true

- name: Reload systemd and enable floating IP service
  ansible.builtin.systemd_service:
    name: cloud-floating-ip
    daemon_reload: true
    enabled: true
    state: started

# Backups keep the previous credentials, so the ones kept are made 0640 too
# (backups written before the config became 0640 are still world-readable).
- name: Cleanup haproxy config backups
  ansible.builtin.shell: |
    set -o pipefail
    find {{ haproxy_config_dir }} -name 'haproxy.cfg.*' -printf '%T@ %p\0' |
      sort -zn | head -zn -2 | cut -zd' ' -f2- |
      xargs -0 rm -f
    find {{ haproxy_config_dir }} -name 'haproxy.cfg.*' -exec chmod 0640 {} +
  args:
    executable: /bin/bash
  changed_when: false

- name: Cleanup keepalived config backups
  ansible.builtin.shell: |
    set -o pipefail
    find {{ keepalived_config_dir }} -name 'keepalived.conf.*' ! -name 'keepalived.conf.sample' -printf '%T@ %p\0' |
      sort -zn | head -zn -2 | cut -zd' ' -f2- |
      xargs -0 rm -f
    find {{ keepalived_config_dir }} -name 'keepalived.conf.*' ! -name 'keepalived.conf.sample' -exec chmod 0640 {} +
  args:
    executable: /bin/bash
  changed_when: false
  when: keepalived_enabled | bool
