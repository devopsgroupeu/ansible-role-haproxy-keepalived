---
# rsyslog receives HAProxy's UDP syslog and Keepalived's facility; it is not
# needed when HAProxy logs to journald and Keepalived is disabled.
- name: Determine whether rsyslog is needed
  ansible.builtin.set_fact:
    haproxy_rsyslog_needed: >-
      {{ (haproxy_enabled | bool and not haproxy_journald | bool)
         or keepalived_enabled | bool }}

- name: Create HAProxy group
  ansible.builtin.group:
    name: "{{ haproxy_group }}"
    system: true
    state: present
  when: haproxy_enabled | bool

- name: Create HAProxy user
  when: haproxy_enabled | bool
  ansible.builtin.user:
    name: "{{ haproxy_user }}"
    group: "{{ haproxy_group }}"
    system: true
    state: present
    shell: /sbin/nologin
    home: "{{ haproxy_socket_dir }}"
    create_home: false

# EL9 minimal and cloud images ship curl-minimal, which conflicts with the
# curl package; either one provides the curl binary the role needs.
- name: Check for an installed curl binary (RHEL/CentOS/Rocky Linux)
  ansible.builtin.stat:
    path: /usr/bin/curl
  register: haproxy_curl_binary
  when:
    - ansible_facts['os_family'] == 'RedHat'

- name: Install runtime prerequisites on RHEL/CentOS/Rocky Linux
  ansible.builtin.package:
    name: >-
      {{ ([] if haproxy_curl_binary.stat.exists else ['curl'])
         + ['logrotate', 'python3']
         + (['rsyslog'] if haproxy_rsyslog_needed | bool else []) }}
    state: present
  when:
    - ansible_facts['os_family'] == 'RedHat'

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when:
    - ansible_facts['distribution'] == "Debian" or ansible_facts['distribution'] == "Ubuntu"

- name: Install runtime prerequisites on Debian/Ubuntu
  ansible.builtin.package:
    name: "{{ ['curl', 'logrotate', 'python3'] + (['rsyslog'] if haproxy_rsyslog_needed | bool else []) }}"
    state: present
  when:
    - ansible_facts['os_family'] == 'Debian'

# EL9 runs SELinux enforcing: haproxy_t may only bind a few HTTP ports, so the
# stats port (1936) and e.g. the RKE2 ports (6443, 9345) need the
# haproxy_connect_any boolean.
- name: Allow HAProxy to use any port under SELinux (EL9)
  when:
    - haproxy_enabled | bool
    - haproxy_selinux_connect_any | bool
    - ansible_facts['os_family'] == 'RedHat'
    - (ansible_facts['selinux'] | default({})).get('status', 'disabled') == 'enabled'
  block:
    - name: Install the SELinux policy management Python bindings
      ansible.builtin.dnf:
        name: python3-libsemanage
        state: present

    - name: Enable the haproxy_connect_any SELinux boolean
      ansible.posix.seboolean:
        name: haproxy_connect_any
        state: true
        persistent: true

- name: Enable non-local binding for the VIP
  when: keepalived_enabled | bool
  ansible.posix.sysctl:
    name: net.ipv4.ip_nonlocal_bind
    value: "1"
    sysctl_file: /etc/sysctl.d/60-keepalived.conf
    sysctl_set: true
    reload: true
    state: present
