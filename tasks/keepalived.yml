---
- name: Install Keepalived via the selected method
  when: keepalived_enabled | bool
  ansible.builtin.include_tasks: "keepalived_install_{{ keepalived_install_method }}.yml"

# A custom keepalived_config_dir is not created by the package or the source
# install.
- name: Ensure Keepalived configuration directory exists
  when: keepalived_enabled | bool
  ansible.builtin.file:
    path: "{{ keepalived_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# validate runs `keepalived -t -f <tmpfile>`, so a rejected config never
# reaches disk (plain `keepalived -t` only checks the compiled-in default path
# and exits 0 when that file is missing).
- name: Copy Keepalived configuration
  when: keepalived_enabled | bool
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: "{{ keepalived_config_dir }}/keepalived.conf"
    # The config holds the VRRP auth_pass; keepalived reads it as root.
    owner: root
    group: root
    mode: "0640"
    validate: "{{ keepalived_binary }} -t -f %s"
    backup: true
  no_log: true  # config renders the VRRP auth_pass; suppress --diff/-v leakage
  register: keepalived_config_result
  # Applied in-play by "Apply Keepalived configuration change" below so the VIP
  # check runs against the new config (a deferred handler is lost when that
  # check fails, and the rerun never re-notifies it).
  notify:
    - Cleanup keepalived config backups

- name: Create keepalived systemd drop-in directory
  when: keepalived_enabled | bool
  ansible.builtin.file:
    path: /etc/systemd/system/keepalived.service.d
    state: directory
    mode: "0755"

- name: Configure Keepalived log facility via systemd drop-in
  when: keepalived_enabled | bool
  ansible.builtin.template:
    src: keepalived.service.d-override.conf.j2
    dest: /etc/systemd/system/keepalived.service.d/override.conf
    mode: "0644"
  register: keepalived_dropin_result

- name: Configure the rsyslog configuration file to accept UDP syslog reception
  when: keepalived_enabled | bool
  ansible.builtin.copy:
    dest: "/etc/rsyslog.d/keepalived.conf"
    mode: "0644"
    content: |
      # Creating separate log files based on the severity
      {{ keepalived_log_facility }}.*  /var/log/keepalived.log
  notify: Restart rsyslog

- name: Enable/Start Keepalived service
  when: keepalived_enabled | bool
  ansible.builtin.systemd_service:
    name: keepalived
    state: started
    enabled: true
    daemon_reload: true
  register: keepalived_service_start

# A unit drop-in change needs a restart; a config, notify script or credentials
# change only needs a reload (keepalived reads notify scripts at exec time).
# Skipped when the task above just started the service with the new files:
# keyed on the state it found (status is read before acting), because that
# task also reports changed when it only enabled a running unit. One host at a
# time, so master and backup never restart together.
- name: Apply Keepalived configuration change
  when:
    - keepalived_enabled | bool
    - >-
      keepalived_config_result is changed
      or keepalived_dropin_result is changed
      or (keepalived_env_result | default({})) is changed
      or (keepalived_notify_script_result | default({})) is changed
    - keepalived_service_start.status.ActiveState | default('') in ['active', 'activating']
  ansible.builtin.systemd_service:
    name: keepalived
    daemon_reload: true
    state: "{{ 'restarted' if keepalived_dropin_result is changed else 'reloaded' }}"
  throttle: 1

- name: Wait for Keepalived to initialize
  when: keepalived_enabled | bool
  ansible.builtin.pause:
    seconds: 5

- name: Check Keepalived process is running
  when: keepalived_enabled | bool
  ansible.builtin.command: pgrep -x keepalived
  register: keepalived_process
  changed_when: false
  failed_when: keepalived_process.rc != 0

- name: Verify Keepalived service status
  when: keepalived_enabled | bool
  ansible.builtin.systemd_service:
    name: keepalived
  register: keepalived_service_status
  failed_when: keepalived_service_status.status.ActiveState != 'active'

# Skipped with nopreempt or any preempt_delay: both nodes then start as BACKUP,
# so the first node up may hold a VIP and the master only takes it over after
# the delay (or never), longer than this check waits. Skipped in check mode,
# where a pending VIP change is not applied (and until would retry on the
# skipped command's empty output).
- name: Check VIP assignment on master node
  when:
    - keepalived_enabled | bool
    - not ansible_check_mode
    - inventory_hostname == haproxy_loadbalancer_master
    - not (keepalived_nopreempt | bool)
    - >-
      keepalived_vrrp_instances
      | map(attribute='preempt_delay', default=keepalived_preempt_delay)
      | map('int') | select('gt', 0) | list | length == 0
  ansible.builtin.command: ip addr show
  register: vip_check
  changed_when: false
  # Every configured VIP must be on an interface, compared as exact addresses
  # (a substring match lets 10.0.0.10 pass on 10.0.0.100). Retried because a
  # reload or a BACKUP-state start takes up to the VRRP master-down interval.
  until: >-
    keepalived_vrrp_instances | map(attribute='virtual_ipaddress')
    | map('regex_replace', '/.*$', '')
    | reject('in', vip_check.stdout | regex_findall('inet6? ([0-9a-f.:]+)/'))
    | list | length == 0
  retries: 10
  delay: 2
