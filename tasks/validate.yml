---
# ============================================================================
# Variable Validation Tasks
# ============================================================================
# This file validates all required variables and configuration before
# proceeding with installation and configuration.
# ============================================================================

# Only Keepalived uses the master/backup names (priority, initial state, VIP
# check), so HAProxy-only deployments do not need them.
- name: Validate load balancer node identification
  when: keepalived_enabled | bool
  ansible.builtin.assert:
    that:
      - haproxy_loadbalancer_master is defined
      - haproxy_loadbalancer_master | length > 0
      - haproxy_loadbalancer_backup is defined
      - haproxy_loadbalancer_backup | length > 0
      - haproxy_loadbalancer_master != haproxy_loadbalancer_backup
    fail_msg: |
      Load balancer master and backup must be defined and different.
      Current values:
        haproxy_loadbalancer_master: '{{ haproxy_loadbalancer_master }}'
        haproxy_loadbalancer_backup: '{{ haproxy_loadbalancer_backup }}'

      Please set these variables to the inventory_hostname of your proxy nodes.
      Example:
        haproxy_loadbalancer_master: "proxy-master-01"
        haproxy_loadbalancer_backup: "proxy-backup-01"
    success_msg: "Load balancer identification validated successfully"

- name: Validate HAProxy configuration
  when: haproxy_enabled | bool
  block:
    - name: Validate HAProxy version
      ansible.builtin.assert:
        that:
          - haproxy_version is defined
          - haproxy_version is version('2.0', '>=')
        fail_msg: "HAProxy version must be 2.0 or higher. Current: {{ haproxy_version | default('not set') }}"
        success_msg: "HAProxy version {{ haproxy_version }} is valid"

    # Branch repos exist only for these releases (haproxy.debian.net
    # *-backports-<branch> suites, vbernat haproxy-<branch> PPAs).
    - name: Validate haproxy_branch for package installs
      when:
        - haproxy_install_method == 'package'
        - haproxy_branch | string | length > 0
      vars:
        haproxy_branch_matrix:
          noble: ["3.0", "3.2"]
          bookworm: ["3.0", "3.2"]
          trixie: ["3.2", "3.4"]
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == 'Debian'
          - (haproxy_branch | string) in haproxy_branch_matrix.get(ansible_facts['distribution_release'], [])
        fail_msg: >-
          haproxy_branch '{{ haproxy_branch }}' is not available for
          {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_release'] }}.
          Branch repos exist for Debian/Ubuntu only, for these releases and
          branches: {{ haproxy_branch_matrix | to_json }}.
        success_msg: "haproxy_branch {{ haproxy_branch }} is available for {{ ansible_facts['distribution_release'] }}"

    - name: Validate HAProxy frontends and backends are defined
      when:
        - haproxy_config is not defined or haproxy_config | length == 0
      ansible.builtin.assert:
        that:
          - (haproxy_frontends | length > 0) or (haproxy_backends | length > 0) or (haproxy_listens | length > 0)
        fail_msg: |
          When haproxy_config is not set, you must define at least one of:
            - haproxy_frontends
            - haproxy_backends
            - haproxy_listens
        success_msg: "HAProxy configuration structure is valid"

    - name: Validate HAProxy stats credentials
      when: haproxy_stats | bool
      ansible.builtin.assert:
        that:
          - haproxy_stats_page_user | length > 0
          - haproxy_stats_page_pass | length > 0
          - haproxy_stats_page_pass != "admin"
        fail_msg: |
          HAProxy stats page credentials must be set and not use default password.
          Please set:
            haproxy_stats_page_user: "<your_username>"
            haproxy_stats_page_pass: "<strong_password>"
        success_msg: "HAProxy stats credentials are configured"
      ignore_errors: "{{ ansible_check_mode }}"

- name: Validate Keepalived configuration
  when: keepalived_enabled | bool
  block:
    - name: Validate Keepalived version
      ansible.builtin.assert:
        that:
          - keepalived_version is defined
          - keepalived_version is version('2.0', '>=')
        fail_msg: "Keepalived version must be 2.0 or higher. Current: {{ keepalived_version | default('not set') }}"
        success_msg: "Keepalived version {{ keepalived_version }} is valid"

    - name: Require at least one VRRP instance when Keepalived is enabled
      ansible.builtin.assert:
        that:
          - keepalived_vrrp_instances | length > 0
        fail_msg: |
          keepalived_enabled is true but keepalived_vrrp_instances is empty.
          Define at least one VRRP instance (virtual_ipaddress, virtual_router_id,
          vrrp_instance_name), or set keepalived_enabled: false for an HAProxy-only node.
        success_msg: "At least one VRRP instance is defined"

    - name: Validate each VRRP instance configuration
      loop: "{{ keepalived_vrrp_instances }}"
      loop_control:
        label: "{{ item.vrrp_instance_name | default('unnamed') }}"
      ansible.builtin.assert:
        that:
          - item.virtual_ipaddress is match('^(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)(/([0-9]|[1-2][0-9]|3[0-2]))?$')
        fail_msg: |
          VRRP instance {{ item.vrrp_instance_name | default('unnamed') }}: virtual_ipaddress
          '{{ item.virtual_ipaddress | default('') }}' is not a valid IP address (with optional /prefix).
        success_msg: "VRRP instance {{ item.vrrp_instance_name }} virtual_ipaddress is valid"

    - name: Validate peer group for unicast mode
      when:
        - keepalived_unicast | default(true) | bool
        - keepalived_unicast_peers | length == 0
      ansible.builtin.assert:
        that:
          - keepalived_peer_group in groups
          - groups[keepalived_peer_group] | length >= 2
        fail_msg: |
          keepalived_unicast is enabled but inventory group '{{ keepalived_peer_group }}'
          is missing or has fewer than 2 hosts. Add both load balancer nodes to it,
          or set keepalived_unicast_peers explicitly.
        success_msg: "Peer group '{{ keepalived_peer_group }}' validated ({{ groups[keepalived_peer_group] | length }} hosts)"

    - name: Hard-assert each unicast peer has a resolvable interface IP
      when:
        - keepalived_unicast | default(true) | bool
        - keepalived_unicast_peers | length == 0
      loop: "{{ groups[keepalived_peer_group] | difference([inventory_hostname]) }}"
      loop_control:
        label: "{{ item }}"
      ansible.builtin.assert:
        that:
          - hostvars[item]['ansible_facts'][keepalived_network_interface | replace('-', '_') | replace('.', '_')] is defined
          - hostvars[item]['ansible_facts'][keepalived_network_interface | replace('-', '_') | replace('.', '_')]['ipv4']['address'] is defined
        fail_msg: >-
          No IPv4 address found on interface '{{ keepalived_network_interface }}' for peer
          '{{ item }}'. Gather facts on all proxy hosts or set keepalived_unicast_peers.
        success_msg: "Peer {{ item }} interface IP resolved"

    - name: Validate virtual_router_id uniqueness
      ansible.builtin.assert:
        that:
          - keepalived_vrrp_instances | map(attribute='virtual_router_id') | list | unique | length == keepalived_vrrp_instances | length
        fail_msg: |
          All virtual_router_id values must be unique within this role.
          Duplicate IDs detected: {{ keepalived_vrrp_instances | map(attribute='virtual_router_id') | list }}
        success_msg: "All virtual_router_id values are unique"

    - name: Validate failover invariant (no positive track-script weight)
      ansible.builtin.assert:
        that:
          - keepalived_haproxy_check_weight is not defined
        fail_msg: |
          keepalived_haproxy_check_weight is set, but this role uses clean
          FAULT-on-failure (no weight) so the VIP always migrates when HAProxy
          dies. A positive weight defeats failover; a negative weight is not
          supported here. Remove keepalived_haproxy_check_weight.
        success_msg: "Failover invariant satisfied (track script uses FAULT-on-failure)"

    - name: Validate VRRP auth - password required when auth type is set
      when: keepalived_auth_type | default('') | length > 0
      ansible.builtin.assert:
        that:
          - keepalived_auth_pass | default('') | length > 0
        fail_msg: |
          keepalived_auth_type is set to '{{ keepalived_auth_type }}' but
          keepalived_auth_pass is empty. Set keepalived_auth_pass (store in
          Ansible Vault: vault_keepalived_auth_pass).
        success_msg: "VRRP auth credentials validated"

    # keepalived uses only the first 8 characters of auth_pass and rejects the
    # config (exit 5) when it has to truncate; catch it here with a readable
    # message instead of behind the template's no_log.
    - name: Validate VRRP auth - password length
      when: keepalived_auth_type | default('') | length > 0
      ansible.builtin.assert:
        that:
          - keepalived_auth_pass | length <= 8
          - >-
            keepalived_vrrp_instances
            | map(attribute='auth_pass', default=keepalived_auth_pass)
            | map('length') | reject('ge', 1) | list | length == 0
          - >-
            keepalived_vrrp_instances
            | map(attribute='auth_pass', default=keepalived_auth_pass)
            | map('length') | select('gt', 8) | list | length == 0
        fail_msg: >-
          VRRP auth_pass must be 1 to 8 characters (keepalived uses only the
          first 8 and rejects a longer one). Check keepalived_auth_pass and the
          auth_pass of these VRRP instances:
          {% for i in keepalived_vrrp_instances %}{% set p = i.auth_pass | default(keepalived_auth_pass) %}{% if p | length < 1 or p | length > 8 %}{{ i.vrrp_instance_name | default('unnamed') }} {% endif %}{% endfor %}
        success_msg: "VRRP auth_pass length validated"

    - name: Validate virtual_router_id range
      ansible.builtin.assert:
        that:
          - >-
            keepalived_vrrp_instances | map(attribute='virtual_router_id')
            | map('int') | reject('ge', 1) | list | length == 0
          - >-
            keepalived_vrrp_instances | map(attribute='virtual_router_id')
            | map('int') | select('gt', 255) | list | length == 0
        fail_msg: >-
          virtual_router_id must be between 1 and 255. Current:
          {{ keepalived_vrrp_instances | map(attribute='virtual_router_id') | list }}
        success_msg: "All virtual_router_id values are within 1-255"

- name: Display configuration summary
  ansible.builtin.debug:
    msg:
      - "=========================================="
      - "Configuration Validation Complete"
      - "=========================================="
      - "Load Balancer Role: {{ 'MASTER' if inventory_hostname == haproxy_loadbalancer_master else 'BACKUP' }}"
      - "HAProxy Enabled: {{ haproxy_enabled }}"
      - "HAProxy Version: {{ haproxy_version if haproxy_enabled else 'N/A' }}"
      - "Keepalived Enabled: {{ keepalived_enabled }}"
      - "Keepalived Version: {{ keepalived_version if keepalived_enabled else 'N/A' }}"
      - "Virtual IPs: {{ keepalived_vrrp_instances | map(attribute='virtual_ipaddress') | join(', ') if keepalived_enabled else 'N/A' }}"
      - "=========================================="
